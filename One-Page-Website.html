<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My One-Page Website</title>
</head>
<body>

    <nav>
        <a href="#home">Home</a> |
        <a href="#pictures">Pictures</a> |
        <a href="#contact">Contact</a> |
        <a href="#videos">Videos</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my first one-page HTML website.</p>
        <p>Welcome! Explore my pictures, watch a video, or contact me.</p>
    </section>

    <section id="pictures">
        <h2>My Pictures</h2>
        <img src="https://placehold.co/300x200?text=Beautiful+Nature"
             alt="Beautiful nature">
        <img src="https://placehold.co/300x200?text=Lovely+Animals"
             alt="Lovely animals">
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" required></textarea>
            <br><br>

            <input type="submit" value="Send Message">
        </form>
    </section>

    <section id="videos">
        <h2>My Video</h2>
        <iframe
            width="400"
            height="225"
            src="https://www.youtube.com/embed/ScMzIvxBSi4"
            title="Sample video"
            allowfullscreen>
        </iframe>
    </section>

    <footer>
        <p>&copy; 2026 My One-Page Website</p>
        <a href="#home">Back to Top</a>
    </footer>

</body>
</html>
